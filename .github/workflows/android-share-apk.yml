name: Android share APK
on:
  workflow_dispatch:
  push:
    branches: [feature/android-share-queue, fix/photo-only-v07, feature/electronic-curation-v07]
    paths: ['android-share/**', '.github/workflows/android-share-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify music policy
        run: |
          mkdir -p /tmp/xand-policy-classes
          javac -d /tmp/xand-policy-classes \
            android-share/app/src/main/java/music/xand/share/MusicSelectionPolicy.java \
            android-share/policy-tests/MusicSelectionPolicyTest.java
          java -cp /tmp/xand-policy-classes music.xand.share.MusicSelectionPolicyTest
      - name: Build APK
        working-directory: android-share
        run: |
          if [ "$GITHUB_REF_NAME" = "feature/electronic-curation-v07" ]; then
            gradle assembleDebug --no-daemon -PxandIsolatedTest=true
          else
            gradle assembleDebug --no-daemon
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: xand-music-share-debug
          path: android-share/app/build/outputs/apk/debug/*.apk
