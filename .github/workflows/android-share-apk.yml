name: Android share APK
on:
  workflow_dispatch:
  push:
    branches: [feature/android-share-queue]
    paths: ['android-share/**', '.github/workflows/android-share-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-share
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: xand-music-share-debug
          path: android-share/app/build/outputs/apk/debug/*.apk
